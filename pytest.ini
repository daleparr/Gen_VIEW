[tool:pytest]
minversion = 6.0
addopts = 
    -ra
    -q
    --strict-markers
    --strict-config
    --disable-warnings
    --tb=short
    --maxfail=5
    --durations=10
    -p no:cacheprovider

testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests for individual components
    integration: Integration tests across multiple components
    performance: Performance and load tests
    slow: Tests that take a long time to run
    asyncio: Tests that use asyncio
    database: Tests that require database access
    redis: Tests that require Redis access
    websocket: Tests that involve WebSocket connections
    frontend: Tests for frontend components and interfaces
    kse_memory: Tests for KSE Memory Service functionality
    multimodal: Tests for multi-modal processing
    api: Tests for API endpoints
    models: Tests for database models
    services: Tests for service layer components

asyncio_mode = auto

# Timeout for async tests (in seconds)
timeout = 300

# Test discovery patterns
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    node_modules
    __pycache__

# Logging configuration for tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage configuration
addopts = --cov=services --cov=demos --cov-report=html --cov-report=term-missing --cov-fail-under=80

filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning