global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@genview.ai'
  
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'
  routes:
  - match:
      severity: critical
    receiver: 'critical-alerts'
  - match:
      severity: warning
    receiver: 'warning-alerts'

receivers:
- name: 'web.hook'
  webhook_configs:
  - url: 'http://localhost:5001/alerts'
    send_resolved: true

- name: 'critical-alerts'
  email_configs:
  - to: 'devops@genview.ai'
    subject: 'CRITICAL: GEN-VIEW-KSE Alert'
    body: |
      Alert: {{ .GroupLabels.alertname }}
      Service: {{ .GroupLabels.service }}
      Severity: {{ .GroupLabels.severity }}
      
      {{ range .Alerts }}
      Description: {{ .Annotations.description }}
      {{ end }}
  slack_configs:
  - api_url: 'YOUR_SLACK_WEBHOOK_URL'
    channel: '#alerts-critical'
    title: 'CRITICAL Alert: {{ .GroupLabels.alertname }}'
    text: |
      Service: {{ .GroupLabels.service }}
      {{ range .Alerts }}
      {{ .Annotations.description }}
      {{ end }}

- name: 'warning-alerts'
  email_configs:
  - to: 'monitoring@genview.ai'
    subject: 'WARNING: GEN-VIEW-KSE Alert'
    body: |
      Alert: {{ .GroupLabels.alertname }}
      Service: {{ .GroupLabels.service }}
      Severity: {{ .GroupLabels.severity }}
      
      {{ range .Alerts }}
      Description: {{ .Annotations.description }}
      {{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']